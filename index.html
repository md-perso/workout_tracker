<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workout Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e0f11">
<meta name="color-scheme" content="dark">
<meta name="description" content="Personal push/pull workout tracker.">

<!-- Home-screen / fullscreen behaviour on iOS -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout">
<meta name="format-detection" content="telephone=no">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button id="topbarBack" class="topbar-back" type="button" hidden>&#8592;</button>
  <h1 id="topbarTitle">Workout</h1>
  <button id="syncPill" class="pill" type="button" aria-live="polite">&hellip;</button>
</header>

<div id="banner" class="banner" role="alert" hidden></div>

<main id="app" class="app"></main>

<script src="app.js"></script>
</body>
</html>
